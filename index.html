#root{height:100%}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.canvas{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;box-shadow:0 18px 60px rgba(30,27,94,.14);background:#fff;overflow:hidden}
.slide{position:absolute;inset:0;animation:fade .45s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.lift{transition:transform .25s ease,box-shadow .25s ease}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(30,27,94,.12)}

.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.96);color:#1E1B5E;border:1px solid #E7EAF0;border-radius:999px;padding:6px 10px;font-size:15px;box-shadow:0 8px 30px rgba(30,27,94,.16);transition:opacity .4s}
.bar.hide{opacity:0;pointer-events:none}
.bar button{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;line-height:1;font-family:inherit;white-space:nowrap}
.bar button:hover,.bar button:focus-visible{background:#E6F6F5;outline:2px solid #00A19B}
.bar .sep{width:1px;height:22px;background:#E7EAF0}
.bar .count{min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.timer{position:fixed;top:14px;left:14px;z-index:20;background:#fff;color:#0B7D73;border:1px solid #E7EAF0;border-radius:12px;padding:6px 12px;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(30,27,94,.12)}
.timer.over{color:#B42318}
.overview{position:fixed;inset:0;z-index:30;background:rgba(238,242,245,.97);overflow:auto;padding:36px;display:grid;grid-template-columns:repeat(auto-fill,384px);justify-content:center;gap:22px;align-content:start}
.thumb{all:unset;position:relative;display:block;width:384px;height:216px;border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 4px 16px rgba(30,27,94,.1);outline:3px solid transparent;direction:ltr}
.thumb:hover,.thumb.cur,.thumb:focus-visible{outline-color:#00A19B}

.noanim *{animation:none!important;transition:none!important}
.thumb .lbl{position:absolute;bottom:6px;right:8px;background:#1E1B5E;color:#fff;font-size:13px;border-radius:6px;padding:2px 8px}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}

}
